services:
  film-tonight:
    build: .
    # Linux native loopback only: no all-interface listener or public ingress.
    network_mode: host
    restart: unless-stopped
    volumes:
      - movie-data:/app/data
      - worker-state:/app/.wrangler
    environment:
      REFRESH_INTERVAL: "600"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/v1/ready',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  movie-data:
  worker-state:
